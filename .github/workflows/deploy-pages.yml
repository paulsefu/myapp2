name: Publică pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă proiectul
        uses: actions/checkout@v7

      - name: Pregătește Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configurează GitHub Pages
        uses: actions/configure-pages@v6

      - name: Instalează dependențele
        run: npm ci

      - name: Construiește aplicația
        run: npm run build

      - name: Pregătește fișierele publice
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publică aplicația
        id: deployment
        uses: actions/deploy-pages@v5
